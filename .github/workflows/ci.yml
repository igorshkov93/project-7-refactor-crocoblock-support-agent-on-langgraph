name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No secrets are configured for this workflow. The suite injects stub
      # credentials in tests/unit/conftest.py and replaces every outbound call,
      # so a green run here proves the tests are genuinely isolated: any real
      # network call would fail on a missing key rather than pass quietly.
      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src app.py

      - name: Test
        run: pytest